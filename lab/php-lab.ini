; CVE-2026-109618 lab: finite memory_limit (do not set -1; that is the mitigation).
memory_limit = 8M
post_max_size = 16M
upload_max_filesize = 16M
max_file_uploads = 2
max_input_vars = 20000
max_input_nesting_level = 64
max_multipart_body_parts = 20000
file_uploads = On
enable_post_data_reading = On
display_errors = On
log_errors = On
error_log = /proc/self/fd/2
session.upload_progress.enabled = On
session.use_strict_mode = 0
expose_php = On
